name: Bug report
description: Something looks wrong or doesn't work with the theme
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Which page or view, and what you expected instead. A screenshot helps a lot.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: scheme
    attributes:
      label: Colour scheme
      options: [Dark, Light]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Spotify and Spicetify versions
      description: Run `spicetify -v`. Spotify's version is in its About window.
  - type: input
    id: extensions
    attributes:
      label: Other extensions installed
      description: For example Spicy Lyrics. Does the bug remain without them?
